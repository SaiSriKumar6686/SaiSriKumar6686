<svg width="100%" height="3" viewBox="0 0 1000 3" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divider-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1000 0; 1000 0; -1000 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="3" fill="url(#divider-grad)"/>
</svg>
